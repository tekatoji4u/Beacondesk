# Build và đăng BeaconDesk lên GitHub Pages mỗi khi có thay đổi trên nhánh main.
name: Đăng lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
        env:
          BD_SINGLE_DOWNLOAD: '1'
      # Bản một tệp HTML để người dùng tải về dùng hoàn toàn ngoại tuyến (không nằm trong bộ nhớ đệm của PWA)
      - run: mkdir -p dist/download && cp dist-single/index.html dist/download/BeaconDesk.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
