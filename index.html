<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BeaconDesk</title>
  <meta name="author" content="Hải Đăng" />
  <meta name="generator" content="BeaconDesk – Powered by Hải Đăng" />
  <meta name="description" content="BeaconDesk – bộ công cụ văn phòng chạy ngay trên trình duyệt: PDF, nhận dạng chữ tiếng Việt, soạn và kiểm tra văn bản hành chính. Dữ liệu ở lại trên máy, dùng được cả khi mất mạng." />
  <meta name="theme-color" content="#005993" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BeaconDesk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!--CSP-->
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <!--MANIFEST-->
  <script>
    // Áp giao diện sáng/tối trước khi vẽ trang để tránh nháy màu.
    (function () {
      try {
        var t = localStorage.getItem('bd-theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
      // Kiểu giao diện (nút chuyển đổi trên đầu trang): 'nova' (mặc định) hoặc 'classic'.
      try { if (localStorage.getItem('bd-skin') === 'classic') document.documentElement.dataset.skin = 'classic'; } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>BeaconDesk cần bật JavaScript để hoạt động.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
